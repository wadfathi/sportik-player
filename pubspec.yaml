name: sportik_player
description: Standalone Sportik video player
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  better_player_plus: ^1.0.8
  crypto: ^3.0.7
  get: ^4.7.2
  flutter_secure_storage: ^9.2.2
  wakelock_plus: ^1.4.0
  photo_manager: ^3.6.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Medium.ttf
    - family: CairoBold
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf
