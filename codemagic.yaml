workflows:
  sportik_player_android:
    name: Sportik Player Android
    max_build_duration: 60
    instance_type: linux

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze Flutter project
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        script: flutter build apk --release --target-platform android-arm64,android-arm,android-x64
      
      - name: Verify APK
        script: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          echo "Checking APK..."
          ls -lh "$APK"
          unzip -t "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"


    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
